<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dheroot Organics | Natural Wellness</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f4ec;
            color: #26352b;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #26352b;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            padding: 60px 8%;
        }

        .hero-content {
            max-width: 650px;
        }

        h1 {
            font-size: clamp(45px, 7vw, 80px);
            margin: 0 0 20px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 28px;
            background: #26352b;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

<body>

<header>
    <div class="logo">Dheroot</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>

        <a href="#">Contact</a>

<section class="hero">

    <div class="hero-content">

        <h1>Rooted in Nature.</h1>

        <p>
            Natural ingredients, traditional wisdom and modern wellness
